[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[[headers]]
  for = "/page/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"



