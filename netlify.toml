[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,GBP_ACCOUNT_ID"

[functions."gbp-sync-cron"]
  schedule = "*/5 * * * *"

[[headers]]
  for = "/page/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*.map"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://lbnqpcrhyebtbblpvazp.supabase.co wss://lbnqpcrhyebtbblpvazp.supabase.co https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://app.netlify.com; object-src 'none'; media-src 'self';"


# Dominio anterior → dominio propio (2026-10-17)
[[redirects]]
  from = "https://etoile-lcp.netlify.app/*"
  to = "https://etoile.ultimaibrahim.dev/:splat"
  status = 301
  force = true

# Archivos internos del repo: el sitio publica la raíz tal cual, así que se cierran a mano (pruebas, scripts, SQL, código de funciones, documentación)
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

