<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://lbnqpcrhyebtbblpvazp.supabase.co wss://lbnqpcrhyebtbblpvazp.supabase.co; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://app.netlify.com; object-src 'none';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Reseñas · étoile</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Cargador Cinematográfico Intensificado con SVG Curvado -->
    <div id="lcp-loader">
        <div class="loader-content">
            <svg class="loader-curve-svg" viewBox="0 0 300 300">
                <defs>
                    <!-- Camino plano recto horizontal para la fase de carga -->
                    <path id="flatPath" d="M 20,230 L 280,230" />
                    <!-- Gradiente lineal para el rellenado horizontal del texto -->
                    <linearGradient id="loaderTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="var(--oro)" id="gradient-stop-1" />
                        <stop offset="0%" stop-color="rgba(245, 239, 230, 0.25)" id="gradient-stop-2" />
                    </linearGradient>
                </defs>
                <!-- étoile en el centro -->
                <text x="150" y="156" class="loader-logo-svg-text" text-anchor="middle">étoile</text>
                <!-- Frase plana (activa durante la carga) -->
                <text class="loader-phrase-svg-text loader-phrase-flat">
                    <textPath href="#flatPath" startOffset="50%" text-anchor="middle">
                        L'art de la crêpe, l'excellence du service
                    </textPath>
                </text>
            </svg>
            <div class="loader-plancha-line" id="lcp-loader-plancha"></div>
        </div>
    </div>

    <div id="app"></div>

    <!-- Core -->
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/kpis.js"></script>
    <script src="js/data-loader.js"></script>

    <!-- Views -->
    <script src="js/views/login.js"></script>
    <script src="js/views/select-region.js"></script>
    <script src="js/views/brand.js"></script>
    <script src="js/views/home.js"></script>
    <script src="js/views/branch.js"></script>
    <script src="js/views/quarter.js"></script>
    <script src="js/views/about.js"></script>
    <script src="js/views/dashboards.js"></script>
    <script src="js/views/privacy.js"></script>

    <!-- Router + Bootstrap -->
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
