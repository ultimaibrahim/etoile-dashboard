    <link rel="stylesheet" href="css/styles.css">

<body>
    <!-- Rastrillo de Crepa Loader (Pantalla Completa) -->
    <div id="lcp-loader">
        <div class="loader-content">
            <svg class="loader-svg" viewBox="0 0 200 200">
                <!-- Griddle plate outline (one-line styled outer ring) -->
                <circle cx="100" cy="100" r="90" class="griddle-plate" />
                <!-- Circular batter line (perfect circle of radius 65) -->
                <circle cx="100" cy="100" r="65" class="batter-circle" />
                <!-- Detailed one-line T-rake -->
                <g class="rake-group" id="lcp-loader-rake">
                    <path d="M 97,100 L 97,38 L 73,38 L 73,32 L 127,32 L 127,38 L 103,38 L 103,100 A 3 3 0 0 1 97,100 Z" class="rake-one-line" />
                </g>
            </svg>
            <div class="loader-brand">
                <span class="brand-text">étoile</span>
                <span class="brand-sub">La Crêpe Parisienne</span>
            </div>
            <div class="loader-progress-bar">
                <div class="loader-progress-fill" id="lcp-loader-fill"></div>
            </div>
        </div>
    </div>

    <div id="app"></div>

    <!-- Core -->
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/kpis.js"></script>
    <script src="js/data-loader.js"></script>

    <!-- Views -->
    <script src="js/views/login.js"></script>
    <script src="js/views/select-region.js"></script>
    <script src="js/views/brand.js"></script>
    <script src="js/views/home.js"></script>
    <script src="js/views/branch.js"></script>
    <script src="js/views/quarter.js"></script>
    <script src="js/views/about.js"></script>
    <script src="js/views/dashboards.js"></script>
    <script src="js/views/privacy.js"></script>

    <!-- Router + Bootstrap -->
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
